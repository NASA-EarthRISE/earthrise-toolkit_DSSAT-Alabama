<html lang="en">
{% load static %}
<head>
    <title>Map | DSSAT-Web Alabama</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="https://code.highcharts.com/highcharts-more.js"></script>

    <script src="https://code.highcharts.com/modules/streamgraph.js"></script>
    <script src="https://code.highcharts.com/modules/series-label.js"></script>
    <script src="https://code.highcharts.com/modules/annotations.js"></script>
    <script src="https://code.highcharts.com/modules/exporting.js"></script>
    <script src="https://code.highcharts.com/modules/export-data.js"></script>
    <script src="https://code.highcharts.com/modules/no-data-to-display.js"></script>
    <script src="https://code.highcharts.com/modules/accessibility.js"></script>
</head>
<body style="overflow-y: hidden">
<a href="#main-content" class="visually-hidden-focusable">Skip to main content</a>
<script>

</script>
<nav class="navbar navbar-expand-lg navbar-light " style="background-color: #0077c8" role="navigation" aria-label="Main navigation">
  <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'home' %}">
          <img src="{% static 'img/AL_Office_of_Climatologist_Seal-02.png' %}" alt="UAH Office of State Climatology seal" style="height:50px; max-width: none;"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
       <h1 style="display: inline;
    color: white;
    margin: auto;
    text-align: center;
    width: 100%;
    font-size: 1.75rem;
    font-weight: 500;">DSSAT-Web Alabama</h1>
    <div class="collapse navbar-collapse d-flex justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active text-white" aria-current="page" href="{% url 'home' %}">Map</a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-white" href='{% url 'about' %}'>About</a>
        </li>

      </ul>
    </div>
  </div>
</nav>
<main id="main-content">
<div class="container-fluid p-0">
    <div class="row h-100">

        <div class="col-md-12 h-100">
            <div class="row h-100">

                <div class="col-md-12 h-100">
                <div id="map-container">
    <div id="map" role="application" aria-label="Interactive map of Alabama counties showing forecasted maize yield by region. Click a county to explore simulation results."></div>
</div>


                </div>
            </div>
        </div>
    </div>

</div>
<div id="floating_div" role="region" aria-label="Region yield summary" aria-live="polite" style="width: 300px;
    max-width: calc(100vw - 40px);
    background-color: white;
    position: fixed;
    z-index: 999;
    top: 300px;
    left: 20px;
    border-radius: 20px;
    padding: 10px;">
    Please click on one of the regions to explore more.
</div>
</main>
<script src="{% static 'js/script.js' %}"></script>
<script src="{% static 'highcharts_config/baseline_template.js' %}"></script>
<footer class="footer" role="contentinfo">
  <div style="display: flex; align-items: center; padding-left: 15px; height: 100%;">
    <img src="{% static 'img/UAH_wht_logo.png' %}" alt="University of Alabama in Huntsville logo" style="height:30px;">
  </div>
</footer>


</body>
</html>
