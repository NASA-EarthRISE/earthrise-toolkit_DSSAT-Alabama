<!DOCTYPE html>
<html>
<head>
    <title>Long-Term Average - Rainfed vs Irrigated</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="row">
    <!-- Cultivar Dropdown -->
    <div class="col-auto">
      <label for="cultivarSelect" class="col-form-label">Cultivar:</label>
    </div>
    <div class="col-auto">
      <select class="form-select" id="cultivarSelect">
         {% for name in cultivars %}
    <option value="{{ name }}">{{ name }}</option>
  {% endfor %}
      </select>
    </div>

    <!-- Soil Type Dropdown -->
    <div class="col-auto">
      <label for="soilSelect" class="col-form-label">Soil Type:</label>
    </div>
    <div class="col-auto">
      <select class="form-select" id="soilSelect">
        {% for name in soil_types %}
    <option value="{{ name }}">{{ name }}</option>
  {% endfor %}
      </select>
    </div>
</div>
<div class="row">
 <div id="container" class="float-start" style="width:50%; height:400px;"></div>
 <div id="container_by_year" class="float-end" style="width:50%; height:400px;"></div>
    </div>
    <!-- Now the content is valid JSON -->
    <script id="categories-data" type="application/json">{{ categories|safe }}</script>
    <script id="rainfed-data" type="application/json">{{ rainfed|safe }}</script>
    <script id="irrigated-data" type="application/json">{{ irrigated|safe }}</script>
  <script id="rainfed-data-year" type="application/json">{{ rainfed_year|safe }}</script>
  <script id="years" type="application/json">{{ years |safe }}</script>
    <script id="irrigated-data-year" type="application/json">{{ irrigated_year|safe }}</script>

    <script>

       function loadChart(){
            const categories = JSON.parse(document.getElementById('categories-data').textContent);
            const rainfed = JSON.parse(document.getElementById('rainfed-data').textContent);
            const irrigated = JSON.parse(document.getElementById('irrigated-data').textContent);

            Highcharts.chart('container', {
                chart: {
                    type: 'column'
                },
                title: {
                    text: 'Long-Term Average'
                },
                xAxis: {
                    categories: categories,
                    title: {
                        text: null
                    }
                },
                yAxis: {
                    min: 0,
                    title: {
                        text: 'Average Yield (t/ha)',
                        align: 'high'
                    },
                    labels: {
                        overflow: 'justify'
                    }
                },
                tooltip: {
                    valueSuffix: ' t/ha'
                },
                plotOptions: {
                    bar: {
                        dataLabels: {
                            enabled: true
                        },
                        groupPadding: 0.1
                    }
                },
                legend: {
                    reversed: false
                },
                series: [
                    {
                        name: 'Rainfed',
                        data: rainfed
                    },
                    {
                        name: 'Irrigated',
                        data: irrigated
                    }
                ]
            });
            const years = JSON.parse(document.getElementById('years').textContent);
             const rainfed_year = JSON.parse(document.getElementById('rainfed-data-year').textContent);
            const irrigated_year = JSON.parse(document.getElementById('irrigated-data-year').textContent);
            Highcharts.chart('container_by_year', {
                chart: {
                    type: 'column'
                },
                title: {
                    text: 'Long-Term Average by Year'
                },
                xAxis: {
                    categories: years,
                    title: {
                        text: null
                    }
                },
                yAxis: {
                    min: 0,
                    title: {
                        text: 'Average Yield (t/ha)',
                        align: 'high'
                    },
                    labels: {
                        overflow: 'justify'
                    }
                },
                tooltip: {
                    valueSuffix: ' t/ha'
                },
                plotOptions: {
                    bar: {
                        dataLabels: {
                            enabled: true
                        },
                        groupPadding: 0.1
                    }
                },
                legend: {
                    reversed: false
                },
                series: [
                    {
                        name: 'Rainfed',
                        data: rainfed_year
                    },
                    {
                        name: 'Irrigated',
                        data: irrigated_year
                    }
                ]
            });
        }
        loadChart();


    </script>

    <!-- Submit Button -->
    <div class="col-auto">
      <button id="submitBtn" class="btn btn-primary">Submit</button>
    </div>
<script>
    document.getElementById('submitBtn').addEventListener('click', function(event) {
  event.preventDefault();
        loadChart();
    });
</script>
</body>
</html>
